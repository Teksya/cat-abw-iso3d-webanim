<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>cat-banner</title>
<style>
  html, body { margin: 0; background: #0a0a0a; color: #ededed; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

  /* Bannière : pleine largeur, ratio 3:1, recadrée au centre sur petit écran */
  .cat-banner { position: relative; width: 100%; aspect-ratio: 3 / 1; min-height: 180px; max-height: 560px; overflow: hidden; background: #11141b; }
  .cat-banner canvas { display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: crisp-edges; image-rendering: pixelated; }

  /* Aperçu de l'avatar en rond, comme sur Discord */
  .profile { display: flex; align-items: center; gap: 16px; padding: 0 24px; margin-top: -64px; position: relative; }
  .avatar { width: 128px; height: 128px; border-radius: 50%; overflow: hidden; border: 6px solid #0a0a0a; background: #11141b; flex: none; }
  .avatar canvas { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
  .profile p { margin: 56px 0 0; color: #8f8f8f; font-size: 14px; }
</style>
</head>
<body>

<div class="cat-banner">
  <canvas id="banner" role="img" aria-label="Blue, une chatonne tachetée noir et brun, dort sur une baie serveur, se réveille, se roule sur le clavier et éteint tout, puis retourne dormir"></canvas>
</div>

<div class="profile">
  <div class="avatar"><canvas id="avatar" role="img" aria-label="La chatonne en gros plan, qui cligne des yeux"></canvas></div>
  <p>Bannière et avatar générés en direct par <code>src/cat-scene.js</code></p>
</div>

<script src="src/cat-scene.js"></script>
<script>
  // Thème via l'adresse : index.html?theme=halloween
  var theme = new URLSearchParams(location.search).get('theme') || undefined;
  CatScene.create(document.getElementById('banner'), { preset: 'banner', theme: theme });
  // L'avatar en direct est en qualité standard (plus léger) ; les GIF exportés sont en HD
  CatScene.create(document.getElementById('avatar'), { preset: 'avatar', theme: theme, quality: 'standard' });
</script>
</body>
</html>
